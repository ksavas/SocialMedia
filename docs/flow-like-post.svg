<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 438" width="1040" height="438" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="438" rx="12" fill="#ffffff"/>
  <path d="M120,66 V388" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M320,66 V388" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M520,66 V388" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M720,66 V388" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M920,66 V388" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <rect x="35" y="20" width="170" height="46" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="120" y="40" font-size="13" font-weight="600" text-anchor="middle" fill="#0F172A">Angular SPA</text>
  <text x="120" y="56" font-size="10.5" text-anchor="middle" fill="#475569">via gateway :8080</text>
  <rect x="235" y="20" width="170" height="46" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="320" y="40" font-size="13" font-weight="600" text-anchor="middle" fill="#1E1B4B">post-service</text>
  <text x="320" y="56" font-size="10.5" text-anchor="middle" fill="#4338CA">:8082</text>
  <rect x="435" y="20" width="170" height="46" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="520" y="48" font-size="13" font-weight="600" text-anchor="middle" fill="#7C2D12">Apache Kafka</text>
  <rect x="635" y="20" width="170" height="46" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="720" y="40" font-size="13" font-weight="600" text-anchor="middle" fill="#1E1B4B">post-service</text>
  <text x="720" y="56" font-size="10.5" text-anchor="middle" fill="#4338CA">counter consumer</text>
  <rect x="835" y="20" width="170" height="46" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="920" y="40" font-size="13" font-weight="600" text-anchor="middle" fill="#1E1B4B">notification-service</text>
  <text x="920" y="56" font-size="10.5" text-anchor="middle" fill="#4338CA">:8085</text>
  <path d="M126,110 H313" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="220" y="103" font-size="11" text-anchor="middle" fill="#334155" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1 · POST /api/posts/{id}/like</text>
  <rect x="198" y="133" width="244" height="24" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="320" y="149" font-size="11" text-anchor="middle" fill="#334155">2 · transaction: like + outbox event</text>
  <path d="M314,182 H127" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text x="220" y="175" font-size="11" text-anchor="middle" fill="#334155" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3 · 204 No Content</text>
  <path d="M326,218 H513" stroke="#EA580C" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="420" y="211" font-size="11" text-anchor="middle" fill="#9A3412" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">4 · post.liked (key = postId)</text>
  <path d="M526,254 H713" stroke="#EA580C" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="620" y="247" font-size="11" text-anchor="middle" fill="#9A3412" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">5 · post.liked, in order per post</text>
  <rect x="583" y="277" width="275" height="24" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="720" y="293" font-size="11" text-anchor="middle" fill="#334155">6 · transaction: eventId + $inc likeCount</text>
  <path d="M526,326 H913" stroke="#EA580C" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="720" y="319" font-size="11" text-anchor="middle" fill="#9A3412" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">7 · post.liked</text>
  <path d="M914,362 H127" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="520" y="355" font-size="11" text-anchor="middle" fill="#334155" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">8 · store notification + SSE: POST_LIKED to the author</text>
  <text x="520" y="418" font-size="11" text-anchor="middle" fill="#64748B">Gray: synchronous requests · Dashed: responses · Orange: asynchronous Kafka events</text>
</svg>
