<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 630" width="1040" height="630" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="630" rx="12" fill="#ffffff"/>

  <g transform="translate(0,70)">
  <rect x="20" y="118" width="1000" height="102" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="34" y="138" font-size="12" fill="#64748B" font-weight="600">SERVICES</text>
  <rect x="20" y="262" width="1000" height="120" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="34" y="282" font-size="12" fill="#64748B" font-weight="600">DATA STORES</text>
  <rect x="20" y="404" width="1000" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="34" y="424" font-size="12" fill="#64748B" font-weight="600">EVENT BUS</text>
  </g>

  <rect x="420" y="20" width="200" height="50" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="520" y="42" font-size="14" font-weight="600" text-anchor="middle" fill="#0F172A">Angular SPA</text>
  <text x="520" y="60" font-size="11" text-anchor="middle" fill="#475569">:4200</text>

  <path d="M520,70 V88" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="420" y="90" width="200" height="50" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="520" y="112" font-size="14" font-weight="600" text-anchor="middle" fill="#2E1065">gateway-service</text>
  <text x="520" y="130" font-size="11" text-anchor="middle" fill="#6D28D9">:8080 · Spring Cloud Gateway</text>

  <g transform="translate(0,70)">

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M520,70 V100"/>
    <path d="M160,100 H880"/>
    <path d="M160,100 V146" marker-end="url(#arrow)"/>
    <path d="M400,100 V146" marker-end="url(#arrow)"/>
    <path d="M640,100 V146" marker-end="url(#arrow)"/>
    <path d="M880,100 V146" marker-end="url(#arrow)"/>
  </g>
  <text x="530" y="90" font-size="11" fill="#475569">REST + JWT · SSE</text>

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M600,148 V130 H190 V146" marker-end="url(#arrow)"/>
    <path d="M440,130 V146" marker-end="url(#arrow)"/>
    <path d="M190,204 V246 H570 V292" marker-end="url(#arrow)"/>
  </g>
  <text x="520" y="126" font-size="10.5" text-anchor="middle" fill="#475569" stroke="#F8FAFC" stroke-width="4" stroke-linejoin="round" paint-order="stroke">internal REST</text>

  <g font-size="14" font-weight="600" text-anchor="middle" fill="#1E1B4B">
    <rect x="65" y="148" width="190" height="56" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="160" y="172">user-service</text>
    <rect x="305" y="148" width="190" height="56" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="400" y="172">post-service</text>
    <rect x="545" y="148" width="190" height="56" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="640" y="172">feed-service</text>
    <rect x="785" y="148" width="190" height="56" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="880" y="172">notification-service</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#4338CA">
    <text x="160" y="192">:8081 · Spring MVC</text>
    <text x="400" y="192">:8082 · Spring MVC</text>
    <text x="640" y="192">:8084 · Spring MVC</text>
    <text x="880" y="192">:8085 · Spring WebFlux</text>
  </g>

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M128,204 V292" marker-end="url(#arrow)"/>
    <path d="M368,204 V292" marker-end="url(#arrow)"/>
    <path d="M608,204 V292" marker-end="url(#arrow)"/>
    <path d="M848,204 V292" marker-end="url(#arrow)"/>
  </g>

  <g text-anchor="middle">
    <rect x="65" y="294" width="135" height="76" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="132" y="312" font-size="12" font-weight="600" fill="#14532D">PostgreSQL</text>
    <text x="132" y="328" font-size="10.5" fill="#166534">social_db</text>
    <text x="132" y="342" font-size="10.5" fill="#166534">users, follows</text>
    <text x="132" y="356" font-size="10.5" fill="#166534">refresh tokens, outbox</text>

    <rect x="305" y="294" width="135" height="76" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="372" y="312" font-size="12" font-weight="600" fill="#14532D">MongoDB</text>
    <text x="372" y="328" font-size="10.5" fill="#166534">replica set</text>
    <text x="372" y="342" font-size="10.5" fill="#166534">posts, likes, comments</text>
    <text x="372" y="356" font-size="10.5" fill="#166534">outbox</text>

    <rect x="545" y="294" width="135" height="76" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="612" y="312" font-size="12" font-weight="600" fill="#14532D">Redis</text>
    <text x="612" y="328" font-size="10.5" fill="#166534">feeds (sorted sets)</text>
    <text x="612" y="342" font-size="10.5" fill="#166534">processed events</text>
    <text x="612" y="356" font-size="10.5" fill="#166534">OAuth state</text>

    <rect x="785" y="294" width="135" height="76" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="852" y="312" font-size="12" font-weight="600" fill="#14532D">PostgreSQL</text>
    <text x="852" y="328" font-size="10.5" fill="#166534">notification_db</text>
    <text x="852" y="342" font-size="10.5" fill="#166534">notifications</text>
    <text x="852" y="356" font-size="10.5" fill="#166534">(R2DBC)</text>
  </g>

  <g stroke="#EA580C" stroke-width="1.5" fill="none">
    <path d="M230,204 V436" marker-end="url(#arrow)"/>
    <path d="M470,206 V436" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M710,206 V436" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M950,206 V438"  marker-start="url(#arrow)"/>
  </g>
  <g font-size="10.5" fill="#9A3412">
    <text x="236" y="392">publishes</text>
    <text x="476" y="392">publishes + consumes</text>
    <text x="716" y="392">publishes + consumes</text>
    <text x="890" y="392">consumes</text>
  </g>

  <rect x="65" y="438" width="910" height="48" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="520" y="459" font-size="14" font-weight="600" text-anchor="middle" fill="#7C2D12">Apache Kafka</text>
  <text x="520" y="477" font-size="11" text-anchor="middle" fill="#9A3412">user.followed · user.unfollowed · post.created · post.deleted · post.liked · post.unliked · comment.created · feed.updated</text>

  <text x="520" y="530" font-size="11" text-anchor="middle" fill="#64748B">Gray arrows: synchronous requests and data access · Orange lines: asynchronous events (arrow into Kafka = publishes, arrow into a service = consumes)</text>
  </g>
</svg>
