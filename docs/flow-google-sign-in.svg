<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 546" width="1040" height="546" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="546" rx="12" fill="#ffffff"/>
  <path d="M145,66 V496" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M395,66 V496" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M645,66 V496" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M895,66 V496" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <rect x="60" y="20" width="170" height="46" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="145" y="40" font-size="13" font-weight="600" text-anchor="middle" fill="#0F172A">Google</text>
  <text x="145" y="56" font-size="10.5" text-anchor="middle" fill="#475569">OpenID Connect</text>
  <rect x="310" y="20" width="170" height="46" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="395" y="48" font-size="13" font-weight="600" text-anchor="middle" fill="#0F172A">Angular SPA</text>
  <rect x="560" y="20" width="170" height="46" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="645" y="40" font-size="13" font-weight="600" text-anchor="middle" fill="#1E1B4B">user-service</text>
  <text x="645" y="56" font-size="10.5" text-anchor="middle" fill="#4338CA">:8081</text>
  <rect x="810" y="20" width="170" height="46" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="895" y="40" font-size="13" font-weight="600" text-anchor="middle" fill="#14532D">Redis</text>
  <text x="895" y="56" font-size="10.5" text-anchor="middle" fill="#166534">OAuth state</text>
  <path d="M401,110 H638" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="520" y="103" font-size="11" text-anchor="middle" fill="#334155" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1 · GET /api/auth/oauth/init</text>
  <path d="M651,146 H888" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="770" y="139" font-size="11" text-anchor="middle" fill="#334155" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2 · SET oauth:state:{state} = nonce (TTL 5 min)</text>
  <path d="M639,182 H402" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text x="520" y="175" font-size="11" text-anchor="middle" fill="#334155" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3 · state, nonce</text>
  <rect x="285" y="205" width="219" height="24" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="395" y="221" font-size="11" text-anchor="middle" fill="#334155">4 · keep state in sessionStorage</text>
  <path d="M389,254 H152" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="270" y="247" font-size="11" text-anchor="middle" fill="#334155" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">5 · redirect (response_type=id_token, state, nonce)</text>
  <path d="M151,290 H388" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text x="270" y="283" font-size="11" text-anchor="middle" fill="#334155" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">6 · /auth/callback#id_token=...&amp;state=...</text>
  <rect x="270" y="313" width="250" height="24" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="395" y="329" font-size="11" text-anchor="middle" fill="#334155">7 · state matches the one it started?</text>
  <path d="M401,362 H638" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="520" y="355" font-size="11" text-anchor="middle" fill="#334155" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">8 · POST /api/auth/login {GOOGLE, idToken, state}</text>
  <path d="M651,398 H888" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="770" y="391" font-size="11" text-anchor="middle" fill="#334155" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">9 · GETDEL oauth:state:{state} (single use)</text>
  <rect x="468" y="421" width="355" height="24" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="645" y="437" font-size="11" text-anchor="middle" fill="#334155">10 · verify signature, audience, nonce, email_verified</text>
  <path d="M639,470 H402" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text x="520" y="463" font-size="11" text-anchor="middle" fill="#334155" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">11 · access token + refresh token cookie</text>
  <text x="520" y="526" font-size="11" text-anchor="middle" fill="#64748B">Gray: synchronous requests · Dashed: responses</text>
</svg>
