<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="560" rx="12" fill="#ffffff"/>

  <rect x="20" y="14" width="1000" height="206" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="34" y="34" font-size="12" fill="#64748B" font-weight="600">PRODUCER SIDE · TRANSACTIONAL OUTBOX</text>
  <rect x="20" y="236" width="1000" height="294" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="34" y="256" font-size="12" fill="#64748B" font-weight="600">CONSUMER SIDE · AT-LEAST-ONCE DELIVERY, IDEMPOTENT PROCESSING</text>

  <g text-anchor="middle">
    <rect x="40" y="58" width="160" height="64" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="120" y="86" font-size="13" font-weight="600" fill="#1E1B4B">Request handler</text>
    <text x="120" y="104" font-size="10.5" fill="#4338CA">e.g. like a post</text>

    <rect x="260" y="58" width="180" height="64" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="350" y="80" font-size="13" font-weight="600" fill="#14532D">Service database</text>
    <text x="350" y="97" font-size="10.5" fill="#166534">business row + outbox row</text>
    <text x="350" y="112" font-size="10.5" fill="#166534">in one transaction</text>

    <rect x="550" y="58" width="170" height="64" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="635" y="86" font-size="13" font-weight="600" fill="#1E1B4B">Outbox poller</text>
    <text x="635" y="104" font-size="10.5" fill="#4338CA">every 1 s, oldest first</text>

    <rect x="820" y="58" width="180" height="64" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="910" y="86" font-size="13" font-weight="600" fill="#7C2D12">Apache Kafka</text>
    <text x="910" y="104" font-size="10.5" fill="#9A3412">event + eventId header</text>

    <rect x="550" y="152" width="170" height="52" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="635" y="173" font-size="11.5" font-weight="600" fill="#334155">No ack within 10 s</text>
    <text x="635" y="190" font-size="10.5" fill="#475569">stays PENDING, retried next poll</text>
  </g>

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M202,90 H256" marker-end="url(#arrow-gray)"/>
    <path d="M442,80 H546" marker-end="url(#arrow-gray)"/>
    <path d="M548,104 H444" marker-end="url(#arrow-gray)"/>
    <path d="M635,124 V148" marker-end="url(#arrow-gray)"/>
  </g>
  <path d="M722,90 H816" stroke="#EA580C" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>

  <g font-size="10.5" text-anchor="middle" fill="#334155" stroke="#F8FAFC" stroke-width="4" stroke-linejoin="round" paint-order="stroke">
    <text x="229" y="83">write</text>
    <text x="495" y="73">read PENDING</text>
    <text x="495" y="118">mark PROCESSED</text>
    <text x="643" y="140" text-anchor="start">failure</text>
    <text x="769" y="83" fill="#9A3412">send, wait ack</text>
  </g>

  <g text-anchor="middle">
    <rect x="820" y="280" width="180" height="56" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="910" y="303" font-size="13" font-weight="600" fill="#1E1B4B">Consumer</text>
    <text x="910" y="321" font-size="10.5" fill="#4338CA">feed · notification · counters</text>

    <polygon points="655,272 735,308 655,344 575,308" fill="#F8FAFC" stroke="#6366F1" stroke-width="1.5"/>
    <text x="655" y="305" font-size="11" font-weight="600" fill="#1E1B4B">eventId</text>
    <text x="655" y="320" font-size="11" font-weight="600" fill="#1E1B4B">processed?</text>

    <rect x="300" y="280" width="200" height="56" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="400" y="303" font-size="13" font-weight="600" fill="#14532D">Apply change</text>
    <text x="400" y="321" font-size="10.5" fill="#166534">and record eventId</text>

    <rect x="40" y="280" width="170" height="56" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="125" y="303" font-size="12" font-weight="600" fill="#334155">Done</text>
    <text x="125" y="321" font-size="10.5" fill="#475569">offset committed</text>

    <rect x="585" y="392" width="140" height="48" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="655" y="412" font-size="12" font-weight="600" fill="#334155">Skip duplicate</text>
    <text x="655" y="429" font-size="10.5" fill="#475569">offset committed</text>

    <rect x="300" y="392" width="200" height="48" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="400" y="412" font-size="12" font-weight="600" fill="#334155">Retry with backoff</text>
    <text x="400" y="429" font-size="10.5" fill="#475569">1 s · 2 s · 4 s · 8 s</text>

    <rect x="40" y="392" width="170" height="48" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="125" y="412" font-size="12" font-weight="600" fill="#7C2D12">&lt;topic&gt;.DLQ</text>
    <text x="125" y="429" font-size="10.5" fill="#9A3412">kept for inspection</text>
  </g>

  <g stroke="#EA580C" stroke-width="1.5" fill="none">
    <path d="M910,124 V276" marker-end="url(#arrow-orange)"/>
    <path d="M298,416 H214" marker-end="url(#arrow-orange)"/>
    <path d="M910,338 V488 H125 V444" marker-end="url(#arrow-orange)"/>
  </g>
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M818,308 H739" marker-end="url(#arrow-gray)"/>
    <path d="M575,308 H504" marker-end="url(#arrow-gray)"/>
    <path d="M655,344 V388" marker-end="url(#arrow-gray)"/>
    <path d="M298,308 H214" marker-end="url(#arrow-gray)"/>
    <path d="M370,338 V388" marker-end="url(#arrow-gray)"/>
    <path d="M430,390 V340" marker-end="url(#arrow-gray)"/>
  </g>

  <g font-size="10.5" fill="#334155" stroke="#F8FAFC" stroke-width="4" stroke-linejoin="round" paint-order="stroke">
    <text x="918" y="200" fill="#9A3412">poll</text>
    <text x="540" y="300" text-anchor="middle">no</text>
    <text x="662" y="370">yes</text>
    <text x="256" y="300" text-anchor="middle">success</text>
    <text x="364" y="368" text-anchor="end">fails</text>
    <text x="436" y="368">re-poll</text>
    <text x="256" y="408" text-anchor="middle" fill="#9A3412">still failing</text>
    <text x="518" y="482" text-anchor="middle" fill="#9A3412">malformed JSON: no retry</text>
  </g>

  <text x="520" y="551" font-size="11" text-anchor="middle" fill="#64748B">Outbox producers: user-service, post-service · Idempotent consumers: feed-service, notification-service, post-service counters</text>
</svg>
