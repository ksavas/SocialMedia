spring.application.name=user-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/social_db}
spring.datasource.username=${DB_USERNAME:social}
spring.datasource.password=${DB_PASSWORD:social123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.secret=${JWT_SECRET:local-dev-only-secret-key-change-me-0123456789}
jwt.expiration=900000
jwt.refresh-expiration=7d
jwt.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}

oauth.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
oauth.microsoft.client-id=${MICROSOFT_CLIENT_ID:dummy-microsoft-client-id}
oauth.microsoft.jwks-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
