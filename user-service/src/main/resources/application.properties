spring.application.name=user-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/social_db
spring.datasource.username=social
spring.datasource.password=social123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=testsecretkeytestsecretkeytestsecretkey12345678
jwt.expiration=86400000

oauth.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
oauth.microsoft.client-id=${MICROSOFT_CLIENT_ID:dummy-microsoft-client-id}
oauth.microsoft.jwks-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys