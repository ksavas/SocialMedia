services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - social-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-6}
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - social-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - social-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social123
      POSTGRES_DB: social_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - ./scripts/dummy-users.sql:/docker-entrypoint-initdb.d/z-dummy-users.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - social-network

  notification-db:
    image: postgres:15
    container_name: notification-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification123
      POSTGRES_DB: notification_db
    ports:
      - "5434:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - social-network

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: social
      MONGO_INITDB_ROOT_PASSWORD: social123
    entrypoint:
      - bash
      - -c
      - |
        echo "c29jaWFsLWZlZWQtcGxhdGZvcm0tbG9jYWwtcmVwbGljYS1zZXQta2V5" > /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        chown 999:999 /tmp/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet -u social -p social123 --authenticationDatabase admin --eval
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }) }
          if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      - social-network

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - social-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    depends_on:
      - redis
    ports:
      - "5540:5540"
    networks:
      - social-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8091:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: social
      ME_CONFIG_MONGODB_ADMINPASSWORD: social123
      ME_CONFIG_MONGODB_URL: mongodb://social:social123@mongodb:27017/?directConnection=true
      ME_CONFIG_BASICAUTH: false
    networks:
      - social-network

  adminer:
    image: adminer:latest
    container_name: adminer
    depends_on:
      - postgres
    ports:
      - "8092:8080"
    networks:
      - social-network

  user-service:
    build: ./user-service
    container_name: user-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/social_db
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-key-change-me-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-4200}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
    networks:
      - social-network

  post-service:
    build: ./post-service
    container_name: post-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      MONGO_HOST: mongodb
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-key-change-me-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-4200}}
    networks:
      - social-network

  feed-service:
    build: ./feed-service
    container_name: feed-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      USER_SERVICE_URL: http://user-service:8081
      POST_SERVICE_URL: http://post-service:8082
      CELEBRITY_FOLLOWER_THRESHOLD: ${CELEBRITY_FOLLOWER_THRESHOLD:-10000}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-key-change-me-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-4200}}
    networks:
      - social-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      R2DBC_URL: r2dbc:postgresql://notification-db:5432/notification_db
      DB_USERNAME: notification
      DB_PASSWORD: notification123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-key-change-me-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-4200}}
    networks:
      - social-network

  seed:
    image: curlimages/curl:8.10.1
    container_name: seed
    depends_on:
      user-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      feed-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    volumes:
      - ./scripts/seed-demo.sh:/seed-demo.sh:ro
    entrypoint: ["sh", "/seed-demo.sh"]
    restart: "no"
    networks:
      - social-network

  frontend:
    build:
      context: ./frontend
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - user-service
      - post-service
      - feed-service
      - notification-service
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - social-network

networks:
  social-network:
    driver: bridge

volumes:
  postgres-data:
  notification-db-data:
  mongo-data:
  redis-data:
