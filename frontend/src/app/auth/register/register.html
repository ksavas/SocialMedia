<div class="register-container">
  <div class="register-card">
    <h2>{{ mode() === 'register' ? 'Create Account' : 'Welcome Back' }}</h2>

    <form (ngSubmit)="onSubmit()">
      @if (mode() === 'register') {
        <div class="form-group">
          <input type="text" [(ngModel)]="registerForm.username" name="username" placeholder="Username" required />
        </div>
        <div class="form-group">
          <input type="email" [(ngModel)]="registerForm.email" name="email" placeholder="Email" required />
        </div>
        <div class="form-group">
          <input type="password" [(ngModel)]="registerForm.password" name="password" placeholder="Password" required />
        </div>
        <div class="form-group">
          <input type="text" [(ngModel)]="registerForm.displayName" name="displayName" placeholder="Display Name" required />
        </div>
      } @else {
        <div class="form-group">
          <input type="text" [(ngModel)]="loginIdentifier" name="identifier" placeholder="Username or Email" required />
        </div>
        <div class="form-group">
          <input type="password" [(ngModel)]="loginPassword" name="loginPassword" placeholder="Password" required />
        </div>
      }

      @if (errorMessage) {
        <div class="error">{{ errorMessage }}</div>
      }

      <button type="submit" [disabled]="isLoading">
        @if (isLoading) {
          {{ mode() === 'register' ? 'Creating account...' : 'Signing in...' }}
        } @else {
          {{ mode() === 'register' ? 'Create Account' : 'Sign In' }}
        }
      </button>
    </form>

    <div class="divider"><span>OR</span></div>

    <app-oauth-buttons />

    <p class="toggle-link">
      {{ mode() === 'register' ? 'Already have an account?' : "Don't have an account?" }}
      <button type="button" class="link-btn" (click)="toggleMode()">
        {{ mode() === 'register' ? 'Sign In' : 'Create one' }}
      </button>
    </p>
  </div>
</div>
